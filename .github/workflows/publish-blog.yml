# Publish next due queued blog post (daily check).
# No PAT / Deploy Hook needed: GitHub's schedule + GITHUB_TOKEN commits the
# post; Vercel's normal Git integration redeploys main automatically.
# Idempotent: if nothing is due (publishAfter > today), the script no-ops.
name: Publish next blog post

on:
  workflow_dispatch:
  schedule:
    # Every day 20:00 UTC = 08:00 New Zealand (UTC+12). Ships at most one
    # ready post whose publishAfter <= today.
    - cron: '0 20 * * *'

permissions:
  contents: write

concurrency:
  group: publish-blog
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Publish next ready post
        run: node scripts/publish-next-blog.mjs

      - name: Commit and push if the tree changed
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "No publishable post due — nothing to commit."
            exit 0
          fi
          git config user.name "lsr-blog-bot"
          git config user.email "blog-bot@localservicerocket.com"
          git add src/pages/blog src/data/blog-posts.js blog-queue
          git commit -m "Publish weekly blog post from queue"
          git push
